version: '3.9'

services:
  web:
    build: .
    command: uvicorn django_backend.config.asgi:application --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A django_backend.config.celery worker -Q media,sync,email,forecast -l INFO
    env_file: .env
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A django_backend.config.celery beat -l INFO
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payton
      POSTGRES_USER: payton
      POSTGRES_PASSWORD: payton
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"


